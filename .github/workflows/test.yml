name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: git config --global user.name ci && git config --global user.email ci@example.org
      - run: python -m pip install . pytest
      - run: python -m pytest
      - run: lean-orch --version
