[project]
name = "lean-orchestrator"
version = "0.1.0"
description = "Autonomous portfolio research loop for open problems in quantum information, with Lean 4 as the formal judge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vinícius Mohr" },
    { name = "Claude (Anthropic)" },
]
keywords = ["agents", "lean4", "mathlib", "quantum-information", "automated-research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/vimohr/lean-orchestrator"
Repository = "https://github.com/vimohr/lean-orchestrator"
Issues = "https://github.com/vimohr/lean-orchestrator/issues"

[project.scripts]
lean-orch = "lean_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean_orchestrator = ["templates/**/*", "templates/**/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib -q"
markers = [
    "lean: requires a working Lean 4 + Mathlib installation (set LEAN_ORCH_TEST_LEAN_PROJECT)",
    "network: requires internet access",
]
